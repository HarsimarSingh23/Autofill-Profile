<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormSpy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --surface2: #1e1e24;
      --border: #2a2a32;
      --border2: #35353f;
      --accent: #7fff6e;
      --accent2: #4af0c4;
      --text: #e8e8f0;
      --muted: #5a5a6e;
      --danger: #ff5f6e;
    }

    body {
      width: 400px;
      min-height: 200px;
      max-height: 600px;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 13px 16px 11px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 26px; height: 26px; background: var(--accent); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; color: var(--text); }
    .logo-text span { color: var(--accent); }

    .status-pill { font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(127,255,110,0.25); background: rgba(127,255,110,0.08); color: var(--accent); letter-spacing: 0.5px; }
    .status-pill.empty { background: rgba(90,90,110,0.12); color: var(--muted); border-color: var(--border); }

    /* ── Nav tabs ── */
    .tab-bar { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab { flex: 1; padding: 9px 0; font-size: 10px; letter-spacing: 0.5px; color: var(--muted); cursor: pointer; text-align: center; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .badge { display: inline-block; min-width: 15px; height: 15px; line-height: 15px; padding: 0 4px; border-radius: 8px; font-size: 9px; background: var(--accent); color: #0d0d0f; font-weight: 600; margin-left: 4px; }
    .badge.dim { background: var(--border2); color: var(--muted); }

    /* ── Toolbar ── */
    .toolbar { padding: 8px 14px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
    .btn { flex: 1; padding: 6px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(127,255,110,0.05); }
    .btn.danger:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,95,110,0.05); }
    .btn.primary { background: var(--accent); color: #0d0d0f; border-color: var(--accent); font-weight: 600; }
    .btn.primary:hover { background: #a0ffaa; }
    .btn.accent2 { border-color: var(--accent2); color: var(--accent2); background: rgba(74,240,196,0.05); }
    .btn.accent2:hover { background: rgba(74,240,196,0.1); }

    /* ── Scrollable content ── */
    .panel { flex: 1; overflow-y: auto; padding: 12px 14px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; display: none; }
    .panel.active { display: block; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 32px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }
    .empty-state p { font-size: 11px; line-height: 1.7; }

    /* ── Field list (Fields tab) ── */
    .field-list { display: flex; flex-direction: column; gap: 5px; }

    .field-item { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px; transition: border-color 0.15s; animation: slideIn 0.18s ease; }
    .field-item:hover { border-color: var(--border2); }
    .field-item.editing { border-color: var(--accent2); background: rgba(74,240,196,0.03); }

    @keyframes slideIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }

    .field-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .field-content { flex: 1; min-width: 0; }
    .field-key { font-size: 9px; color: var(--accent2); letter-spacing: 0.5px; margin-bottom: 3px; }
    .field-value { font-size: 12px; color: var(--text); word-break: break-all; line-height: 1.4; }
    .field-value.boolean { color: var(--accent); }

    .field-actions { display: flex; gap: 4px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; margin-top: 1px; }
    .field-item:hover .field-actions { opacity: 1; }

    .icon-btn { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
    .icon-btn:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(74,240,196,0.08); }
    .icon-btn.del:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,95,110,0.08); }

    .edit-row { display: none; margin-top: 8px; gap: 5px; align-items: center; }
    .field-item.editing .edit-row { display: flex; }
    .field-item.editing .field-value { display: none; }

    .edit-input { flex: 1; background: var(--bg); border: 1px solid var(--accent2); border-radius: 4px; padding: 5px 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); outline: none; }
    .edit-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(127,255,110,0.1); }
    .save-btn { padding: 5px 10px; background: var(--accent); border: none; border-radius: 4px; color: #0d0d0f; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .save-btn:hover { background: #a0ffaa; }
    .cancel-btn { padding: 5px 8px; background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 10px; cursor: pointer; }
    .cancel-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* ── JSON view ── */
    .json-box { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 12px; }
    .json-box pre { font-size: 11px; line-height: 1.75; color: var(--text); white-space: pre-wrap; word-break: break-all; }
    .json-box .key { color: var(--accent2); }
    .json-box .str { color: #ffd080; }
    .json-box .bool { color: var(--accent); }
    .json-box .num { color: #ff9f7e; }

    /* ── Saved profiles tab ── */
    .profile-list { display: flex; flex-direction: column; gap: 8px; }

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      animation: slideIn 0.18s ease;
    }

    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      cursor: pointer;
      gap: 8px;
    }

    .profile-header:hover { background: rgba(255,255,255,0.02); }

    .profile-meta { flex: 1; min-width: 0; }

    .profile-url {
      font-size: 10px;
      color: var(--accent2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .profile-stats { font-size: 9px; color: var(--muted); }

    .profile-toggle { font-size: 10px; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
    .profile-card.open .profile-toggle { transform: rotate(90deg); }

    .profile-actions { display: flex; gap: 5px; flex-shrink: 0; }

    .profile-body {
      display: none;
      padding: 0 12px 10px;
      border-top: 1px solid var(--border);
    }

    .profile-card.open .profile-body { display: block; }

    .profile-fields { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }

    .profile-field { display: flex; gap: 8px; align-items: baseline; font-size: 11px; }
    .pf-key { color: var(--accent2); font-size: 9px; flex-shrink: 0; min-width: 90px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pf-val { color: var(--text); word-break: break-all; }

    .profile-footer { margin-top: 10px; display: flex; gap: 6px; }
    .sm-btn { padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 10px; cursor: pointer; transition: all 0.12s; }
    .sm-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(127,255,110,0.06); }
    .sm-btn.del:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,95,110,0.06); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #0d0d0f; font-size: 10px; font-weight: 600; padding: 5px 14px; border-radius: 20px; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; z-index: 9999; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">⬡</div>
      <div class="logo-text">Form<span>Spy</span></div>
    </div>
    <div class="status-pill empty" id="status-pill">● waiting</div>
  </header>

  <div class="tab-bar">
    <div class="tab active" data-tab="fields">Fields <span class="badge" id="count-badge">0</span></div>
    <div class="tab" data-tab="json">JSON</div>
    <div class="tab" data-tab="saved">Saved <span class="badge dim" id="saved-badge">0</span></div>
  </div>

  <!-- Fields tab toolbar -->
  <div class="toolbar" id="fields-toolbar">
    <button class="btn" id="btn-copy">⎘ Copy JSON</button>
    <button class="btn accent2" id="btn-autofill">⚡ Autofill</button>
    <button class="btn danger" id="btn-clear">✕ Clear</button>
    <button class="btn primary" id="btn-refresh">↻</button>
  </div>

  <!-- Saved tab toolbar (hidden by default) -->
  <div class="toolbar" id="saved-toolbar" style="display:none;">
    <button class="btn danger" id="btn-clear-all">✕ Clear All Saved</button>
  </div>

  <!-- FIELDS PANEL -->
  <div class="panel active" id="panel-fields">
    <div class="empty-state" id="empty-state">
      <div class="icon">◻</div>
      <p>No fields tracked yet.<br/>Fill in a form on this page.</p>
    </div>
    <div class="field-list" id="field-list" style="display:none;"></div>
  </div>

  <!-- JSON PANEL -->
  <div class="panel" id="panel-json">
    <div class="empty-state" id="json-empty">
      <div class="icon">{ }</div>
      <p>No data yet.</p>
    </div>
    <div class="json-box" id="json-view" style="display:none;"></div>
  </div>

  <!-- SAVED PANEL -->
  <div class="panel" id="panel-saved">
    <div class="empty-state" id="saved-empty">
      <div class="icon">🗄</div>
      <p>No saved profiles yet.<br/>Fill a form and it will be<br/>saved here automatically.</p>
    </div>
    <div class="profile-list" id="profile-list" style="display:none;"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
